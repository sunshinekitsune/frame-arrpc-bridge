name: Release

on:
    workflow_dispatch:
    push:
        tags: ["v*"]

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: mlugg/setup-zig@v2
              with:
                  version: 0.17.0

            - name: Build
              run: |
                  mkdir dist
                  zig build -Dtarget=aarch64-linux-musl -Doptimize=ReleaseSafe
                  cp zig-out/bin/frame-arrpc-bridge-aarch64-linux dist/frame-arrpc-bridge-aarch64-linux

            - name: Package
              run: |
                  cp frame/install.sh frame/uninstall.sh frame/systemd/frame-arrpc-bridge.service dist/
                  cd dist
                  sha256sum \
                    frame-arrpc-bridge-aarch64-linux \
                    install.sh \
                    uninstall.sh \
                    frame-arrpc-bridge.service > SHA256SUMS

            - name: Publish
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
